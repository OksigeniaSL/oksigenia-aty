name: secret-scan

# Oksigenia Aty: gitleaks over what Oksigenia added on top of Moodle's app (since v5.2.1), as in the plugins' repos.
on:
  pull_request:
  push:
    branches: [oksigenia-v52]

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          # Pinned version, checked against the checksum published with the release: the security job does not trust
          # a downloaded binary blindly.
          GITLEAKS_VERSION=8.18.4
          BASE="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -sSLf "${BASE}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tgz
          curl -sSLf "${BASE}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" -o /tmp/gitleaks.checksums
          EXPECTED=$(grep 'linux_x64.tar.gz' /tmp/gitleaks.checksums | awk '{print $1}')
          if [ -z "$EXPECTED" ]; then echo "no checksum for linux_x64"; exit 1; fi
          echo "${EXPECTED}  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Detect secrets in Oksigenia's commits
        run: |
          git fetch --no-tags origin 'refs/tags/v5.2.1:refs/tags/v5.2.1'
          gitleaks detect --source . --redact --verbose --exit-code 1 --log-opts="v5.2.1..HEAD"
