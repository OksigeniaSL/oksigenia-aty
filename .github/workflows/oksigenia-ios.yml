# Builds Oksigenia Aty for the iOS simulator, runs it there and keeps screenshots of its first screen.
#
# Nothing is signed and nothing goes to Apple: a simulator build needs no Apple account, no certificates and no secrets.
# The web part is built on Linux, the same way as in oksigenia-android.yml, because the arm64 macOS runner has 7 GB of
# memory and build:prod asks for 8.
#
# It takes much longer than Android, and kit/ci-verde.sh waits for every workflow of a commit, so it does not run on every
# push: on demand, on an Oksigenia tag, and when something that changes the native build changes.
#
# Started by hand with a demo site, it also takes the App Store screenshots (scripts/oksigenia-store-shots.sh): a 6.9"
# iPhone, signed in with the token in the repository secrets ATY_SHOTS_TOKEN and ATY_SHOTS_PRIVATETOKEN.
#
# The notification service extension (resources/ios/NotificationService) has its own tests first, which take a minute
# on the Mac: its decryption against libsodium (scripts/oksigenia-nse-tests.sh). The build then checks that the extension
# is inside the app with the app's version, and the simulator receives a test notice: there is no key in its keychain,
# so the extension leaves the generic text, and its log shows that iOS ran it.
name: Oksigenia Aty iOS simulator

on:
  workflow_dispatch:
    inputs:
      shots_site:
        description: 'For App Store screenshots: https address of the demo site (empty: no store screenshots)'
        required: false
        default: ''
      shots_course:
        description: 'For App Store screenshots: id of the course of the second scene'
        required: false
        default: ''
  push:
    branches: [oksigenia-v52]
    tags: ['oksigenia-v*']
    paths:
      - '.github/workflows/oksigenia-ios.yml'
      - 'config.xml'
      - 'resources/ios/lproj/**'
      - 'GoogleService-Info.plist'
      - 'package.json'
      - 'package-lock.json'
      - 'cordova-plugin-moodleapp/**'
      - 'patches/**'
      - 'resources/ios/NotificationService/**'
      - 'scripts/cordova-hooks/**'
      - 'scripts/oksigenia-nse-tests.sh'

permissions:
  contents: read

concurrency:
  group: oksigenia-ios-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Bundle all languages (Moodle langpacks + Oksigenia strings)
        run: |
          mkdir -p src/assets/lang
          LANGVERSION=5.2 bash scripts/update_langpacks.sh
          node scripts/oksigenia-merge-lang.mjs

      - name: Build the app plugin and the web assets
        run: |
          npm run prod --prefix cordova-plugin-moodleapp
          npm run build:prod

      # The web build does not reference cordova.js (see oksigenia-android.yml); cordova prepare provides the file itself.
      - name: Make cordova available to the web app
        run: |
          grep -q 'src="cordova.js"' www/index.html || \
            sed -i 's#</head>#  <script src="cordova.js"></script>\n</head>#' www/index.html
          grep -n 'cordova.js' www/index.html

      - name: Pack the web assets
        run: tar -czf www.tgz www

      - name: Upload the web assets
        uses: actions/upload-artifact@v4
        with:
          name: www
          path: www.tgz
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  simulator:
    needs: web
    runs-on: macos-26
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      # First, and in a minute: a mistake in the decryption stops the run before the long build.
      - name: Test the notification service extension's decryption
        run: bash scripts/oksigenia-nse-tests.sh

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Show the tools
        run: |
          sw_vers
          xcodebuild -version
          pod --version
          xcrun simctl list runtimes

      - name: Install dependencies
        run: npm ci

      - name: Install Cordova
        run: npm install -g cordova@13.0.0

      - name: Fetch the web assets
        uses: actions/download-artifact@v4
        with:
          name: www

      - name: Unpack the web assets
        run: |
          tar -xzf www.tgz
          rm www.tgz

      - name: Build the app plugin
        run: npm run prod --prefix cordova-plugin-moodleapp

      - name: Prepare the iOS platform
        run: |
          mkdir -p dist
          cordova prepare ios --no-telemetry --verbose > dist/prepare.log 2>&1 || { tail -80 dist/prepare.log; exit 1; }
          tail -5 dist/prepare.log

      # By its id: cordova's own choice is a device name that may not exist on the newest iOS, and xcodebuild then gives up.
      - name: Pick a simulator
        run: |
          UDID=$(xcrun simctl list devices available --json | jq -r '
            .devices | to_entries
            | map(select(.key | test("SimRuntime\\.iOS-")))
            | sort_by(.key | capture("iOS-(?<a>[0-9]+)-(?<b>[0-9]+)") | [(.a | tonumber), (.b | tonumber)])
            | last.value | map(select(.name | startswith("iPhone")))
            | (map(select(.name == "iPhone 17")) + .) | first.udid')
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl list devices | grep "$UDID"

      # GoogleService-Info.plist is moodleapp's empty one, as committed. With IS_GCM_ENABLED false the push plugin never
      # calls [FIRApp configure], so the app starts without a Firebase project.
      - name: Build for the simulator
        id: build
        run: |
          cordova build ios --emulator --debug --no-telemetry --verbose \
            "--buildFlag=-destination platform=iOS Simulator,id=$UDID" --buildFlag=-IDEBuildingContinueBuildingAfterErrors=YES > dist/build.log 2>&1 || {
            grep -E ' error: |fatal error|BUILD FAILED' dist/build.log | sort -u | cut -c1-300 | head -60
            tail -30 dist/build.log | cut -c1-300
            exit 1
          }
          tail -5 dist/build.log

      # The texts iOS shows when the app asks for a permission, and each language they come in: every *UsageDescription
      # of Info.plist, and every <lang>.lproj/InfoPlist.strings the build put in the bundle (none means iOS shows English).
      - name: Show the permission texts and their languages
        run: |
          APP=$(find platforms/ios/build -maxdepth 2 -type d -name '*.app' | head -1)
          plutil -extract CFBundleLocalizations json -o - "$APP/Info.plist"; echo
          plutil -convert json -o - "$APP/Info.plist" | python3 -c '
          import json, sys
          for k, v in sorted(json.load(sys.stdin).items()):
              if k.endswith("UsageDescription"):
                  print(f"{k}: {v}")'
          # The bundle's name has a space ("Oksigenia Aty.app"): one path per line, never split on spaces.
          [ -n "$(find "$APP" -maxdepth 2 -name InfoPlist.strings)" ] || { echo "No InfoPlist.strings in the bundle"; exit 1; }
          find "$APP" -maxdepth 2 -name InfoPlist.strings | sort | while IFS= read -r f; do
            echo "== ${f#"$APP"/}"; plutil -p "$f"
          done

      # The extension, inside the app with the app's version, and the generic text of encrypted notices in every language.
      - name: Check the notification service extension
        run: |
          APP=$(find platforms/ios/build -maxdepth 2 -type d -name '*.app' | head -1)
          EXT="$APP/PlugIns/NotificationService.appex"
          [ -d "$EXT" ] || { echo "No NotificationService.appex in the app"; ls -la "$APP" "$APP/PlugIns" || true; exit 1; }
          ls -la "$EXT"
          STATUS=0
          for FIELD in CFBundleIdentifier CFBundlePackageType CFBundleShortVersionString CFBundleVersion; do
            A=$(/usr/libexec/PlistBuddy -c "Print :$FIELD" "$APP/Info.plist")
            E=$(/usr/libexec/PlistBuddy -c "Print :$FIELD" "$EXT/Info.plist")
            echo "$FIELD: app $A, extension $E"
            case $FIELD in
              CFBundleIdentifier) [ "$E" = "$A.NotificationService" ] || STATUS=1 ;;
              CFBundlePackageType) [ "$E" = "XPC!" ] || STATUS=1 ;;
              *) [ "$E" = "$A" ] || STATUS=1 ;;
            esac
          done
          plutil -extract NSExtension json -o - "$EXT/Info.plist"; echo
          # An app extension with its own Frameworks folder is refused by the App Store.
          [ ! -d "$EXT/Frameworks" ] || { echo "The extension carries a Frameworks folder"; ls -la "$EXT/Frameworks"; STATUS=1; }
          # The settings Xcode resolved for it, over the ones cordova-plugin-add-swift-support writes everywhere.
          (cd platforms/ios && xcodebuild -project "$(ls -d ./*.xcodeproj | head -1)" -target NotificationService \
            -configuration Debug -sdk iphonesimulator -showBuildSettings 2> /dev/null | grep -E \
            ' (SWIFT_VERSION|SWIFT_OBJC_BRIDGING_HEADER|ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES|LD_RUNPATH_SEARCH_PATHS|PRODUCT_BUNDLE_IDENTIFIER|IPHONEOS_DEPLOYMENT_TARGET|CODE_SIGN_ENTITLEMENTS) = ') || true
          codesign -dvv "$EXT" 2>&1 | grep -E '^(Identifier|Signature|Authority|TeamIdentifier)=' || true
          codesign -d --entitlements - --xml "$EXT" 2> /dev/null | plutil -p - 2> /dev/null || true
          [ -n "$(find "$APP" -maxdepth 2 -name Localizable.strings)" ] || { echo "No Localizable.strings in the app"; STATUS=1; }
          find "$APP" -maxdepth 2 -name Localizable.strings | sort | while IFS= read -r f; do
            echo "== ${f#"$APP"/}"; plutil -p "$f"
          done
          exit "$STATUS"

      - name: Boot the simulator
        timeout-minutes: 15
        run: xcrun simctl bootstatus "$UDID" -b

      # Optional: answers the notification prompt beforehand, for the shots without it. If it fails, the rest still runs.
      - name: Install applesimutils
        continue-on-error: true
        timeout-minutes: 10
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
        run: |
          brew tap wix/brew
          brew trust wix/brew
          brew install applesimutils

      - name: Run the app and take screenshots
        timeout-minutes: 20
        run: |
          APP=$(find platforms/ios/build -maxdepth 2 -type d -name '*.app' | head -1)
          echo "App: $APP"; du -sh "$APP"
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")
          EXECUTABLE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")
          mkdir -p dist/screenshots dist/logs
          cp "$APP/AppIcon60x60@2x.png" dist/screenshots/app-icon.png || true

          install_clean() {
            xcrun simctl uninstall "$UDID" "$BUNDLE_ID" || true
            xcrun simctl install "$UDID" "$APP"
          }

          # Starts the app and shoots at the given seconds; fails if the process has died by then.
          launch_and_shoot() {
            local label=$1 start pid t
            shift
            xcrun simctl terminate "$UDID" "$BUNDLE_ID" 2> /dev/null || true
            start=$SECONDS
            pid=$(xcrun simctl launch "$UDID" "$BUNDLE_ID" | awk -F': ' '{print $2}')
            echo "$label: pid $pid"
            for t in "$@"; do
              while (( SECONDS - start < t )); do sleep 1; done
              xcrun simctl io "$UDID" screenshot "dist/screenshots/$label-${t}s.png"
            done
            ps -p "$pid" > /dev/null || { echo "$label: the app is not running any more"; return 1; }
          }

          STATUS=0
          install_clean
          launch_and_shoot en 5 15 30 60 || STATUS=1
          xcrun simctl spawn "$UDID" log show --last 5m --style compact \
            --predicate "process == \"$EXECUTABLE\"" > dist/logs/en.log || true

          if [ "$STATUS" = 0 ]; then
            # A phone set to Spanish, to see whether the app follows the device language as it does on Android.
            xcrun simctl spawn "$UDID" defaults write 'Apple Global Domain' AppleLanguages -array es-ES en
            xcrun simctl spawn "$UDID" defaults write 'Apple Global Domain' AppleLocale -string es_ES
            xcrun simctl shutdown "$UDID"
            xcrun simctl bootstatus "$UDID" -b
            install_clean
            launch_and_shoot es 30 60 || STATUS=1

            # The app asks for notifications when it starts, as moodleapp does, and the prompt covers half of the screen.
            if command -v applesimutils > /dev/null && perl -e 'alarm shift; exec @ARGV' 180 \
              applesimutils --byId "$UDID" --bundle "$BUNDLE_ID" --setPermissions 'notifications=YES'; then
              launch_and_shoot es-noprompt 30 || STATUS=1
            else
              echo "No shot without the prompt: applesimutils is missing or failed"
            fi
          fi

          # Crash reports of the simulator's apps land on the host.
          find "$HOME/Library/Logs/DiagnosticReports" -name "*$EXECUTABLE*" -exec cp {} dist/logs/ \; 2> /dev/null || true
          ls -la dist/screenshots dist/logs
          exit "$STATUS"

      # An encrypted notice to the closed app, as the bridge sends it. The simulator's keychain has no key (nobody signed in),
      # so the extension must leave the generic text in Spanish; its log shows that iOS ran it. Informative: the simulator
      # may not run extensions for simctl push, and needs the notification permission that applesimutils gives.
      - name: Send an encrypted test notice to the extension
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 10
        run: |
          APP=$(find platforms/ios/build -maxdepth 2 -type d -name '*.app' | head -1)
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")
          mkdir -p dist/screenshots dist/logs
          cat > dist/notice.apns << EOF
          {"Simulator Target Bundle": "$BUNDLE_ID",
           "aps": {"alert": {"loc-key": "You have a new notification", "body": "You have a new notification"},
                   "sound": "default", "mutable-content": 1},
           "encrypted": "1", "notId": "4711", "site": "0f1e2d3c4b5a69788796a5b4c3d2e1f0",
           "sitefullname": "$(head -c 70 /dev/urandom | base64)", "smallmessage": "$(head -c 90 /dev/urandom | base64)"}
          EOF
          # iOS knows the extension once the app is installed: its Info.plist and principal class are right.
          xcrun simctl spawn "$UDID" pluginkit -mAvvv -p com.apple.usernotifications.service 2>&1 | tee dist/logs/pluginkit.txt | head -20
          grep -q "$BUNDLE_ID.NotificationService" dist/logs/pluginkit.txt && echo "iOS has the extension registered."
          xcrun simctl terminate "$UDID" "$BUNDLE_ID" 2> /dev/null || true
          START=$(date '+%Y-%m-%d %H:%M:%S')
          xcrun simctl push "$UDID" "$BUNDLE_ID" dist/notice.apns
          sleep 6
          xcrun simctl io "$UDID" screenshot dist/screenshots/notice-banner.png
          sleep 4
          xcrun simctl io "$UDID" screenshot dist/screenshots/notice-later.png
          xcrun simctl spawn "$UDID" log show --start "$START" --info --debug --style compact \
            --predicate 'subsystem == "com.oksigenia.aty.NotificationService" OR process == "NotificationService" OR eventMessage CONTAINS[c] "NotificationService"' \
            > dist/logs/notification-service.log || true
          cut -c1-300 dist/logs/notification-service.log | tail -40
          grep -q 'generic text stays' dist/logs/notification-service.log && echo "The extension ran and left the generic text."
          grep -q 'generic text stays' dist/logs/notification-service.log || echo "No sign of the extension in the log: simctl push may not run it."

      # The App Store screenshots, only when started by hand with a demo site. idb taps the one confirmation by its label.
      - name: Set up Python for idb
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.shots_site != '' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install idb
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.shots_site != '' }}
        timeout-minutes: 20
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
        run: |
          brew tap facebook/fb
          brew install facebook/fb/idb-companion
          python -m pip install fb-idb==1.1.7

      - name: Take the App Store screenshots
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.shots_site != '' }}
        timeout-minutes: 75
        env:
          SITE: ${{ inputs.shots_site }}
          COURSE: ${{ inputs.shots_course }}
          TOKEN: ${{ secrets.ATY_SHOTS_TOKEN }}
          PRIVATETOKEN: ${{ secrets.ATY_SHOTS_PRIVATETOKEN }}
        run: |
          APP=$(find platforms/ios/build -maxdepth 2 -type d -name '*.app' | head -1)
          APP="$APP" OUT=dist/store bash scripts/oksigenia-store-shots.sh

      - name: Shut the simulator down
        if: always()
        run: xcrun simctl shutdown all || true

      - name: Upload the screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oksigenia-aty-ios-simulator
          path: dist/**
          retention-days: 14
          if-no-files-found: warn
